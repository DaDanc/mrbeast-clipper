name: 4. Složi raspored objava

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Složi objave na termine iz config.yaml
        run: python -m clipper.main reschedule

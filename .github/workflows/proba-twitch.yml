name: Proba Twitch (privremeno)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q requests yt-dlp
      - run: python tools/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: probe/*.jpg

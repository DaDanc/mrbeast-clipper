name: Provjeri postavke

on:
  workflow_dispatch:
    inputs:
      obrisi:
        description: "Obriši iz Buffer reda zakazane objave koje sadrže ovaj tekst (prazno = ništa)"
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests cloudinary
      - name: Obriši iz Buffera
        if: inputs.obrisi != ''
        env:
          OBRISI: ${{ inputs.obrisi }}
        run: python -m clipper.main ocisti --sadrzi "$OBRISI"
      - run: python -m clipper.main check

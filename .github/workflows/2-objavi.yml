name: 2. Objavi odobreni klip

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: github.event.label.name == 'objavi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-${{ github.event.issue.number }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Pošalji u Buffer
        run: python -m clipper.main publish --issue ${{ github.event.issue.number }}

name: 2. Objavi odobreni klip

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      klip:
        description: "Broj klipa (Issuea)"
        required: true
      vrijeme:
        description: "Vrijeme objave po našem vremenu, npr. 21:30 (prazno = sljedeći slobodan termin)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'objavi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-${{ github.event.issue.number || inputs.klip }}
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instaliraj ffmpeg i font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sSfL -o fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - run: pip install pyyaml requests cloudinary
      - name: Pošalji u Buffer
        env:
          KLIP: ${{ github.event.issue.number || inputs.klip }}
          VRIJEME: ${{ inputs.vrijeme }}
        run: python -m clipper.main publish --issue "$KLIP" --at "$VRIJEME"

name: Objavi Twitch klip

# Jednom dnevno (rano ujutro) odabere 3 klipa, montira ih i SVA 3 odmah zakaže u Bufferu za današnje
# nasumične termine (config.json: objave_dnevno, prozor_objava, min_razmak_minuta).
# GitHub cron je "best effort" (zna preskočiti runove), zato ima još rezervnih runova tijekom jutra.
# Svaki run je idempotentan: ako posted.json već ima sve današnje objave, odmah izađe.
# Ako je termin već prošao kad run krene, klip ide na najbliže sljedeće slobodno vrijeme danas.

on:
  schedule:
    - cron: "37 3 * * *"    # glavni dnevni run
    - cron: "17 4 * * *"    # rezerve
    - cron: "47 6 * * *"
    - cron: "23 9 * * *"
    - cron: "53 11 * * *"
  workflow_dispatch:
    inputs:
      sutra:
        description: "Zakaži sve objave za SUTRA u Bufferu (pravi postovi; sutrašnji runovi onda ništa ne rade)"
        type: boolean
        default: false
      test:
        description: "Test: napravi videe kao artifact, NE objavljuj"
        type: boolean
        default: true
      broj:
        description: "Koliko test videa"
        default: "3"
      klipovi:
        description: "Twitch ID-jevi klipova (zarezom). Test uključen = samo napravi te videe; Test isključen = objavi ih DANAS"
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  klip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: clipper-state
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Što treba napraviti
        id: m
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          SUTRA: ${{ inputs.sutra }}
          TEST: ${{ inputs.test }}
          IDS: ${{ inputs.klipovi }}
        run: |
          if [ "$MANUAL" = "true" ] && [ "$SUTRA" = "true" ]; then MODE=dan; DATUM=sutra
          elif [ "$MANUAL" = "true" ] && [ "$TEST" = "true" ]; then MODE=test
          elif [ -n "$IDS" ]; then MODE=ids
          else MODE=dan; DATUM=danas; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "dan" ]; then
            python3 -m clipper.main dan --datum "$DATUM" --provjeri   # upiše treba=0/1 i datum
          else
            echo "treba=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Već zakazano – ništa ne radim
        if: steps.m.outputs.treba != '1'
        run: echo "::notice::Sve objave za ${{ steps.m.outputs.datum }} su već zakazane u Bufferu."

      - uses: actions/setup-python@v5
        if: steps.m.outputs.treba == '1'
        with:
          python-version: "3.11"
          cache: pip
      - name: Instaliraj ffmpeg i font
        if: steps.m.outputs.treba == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sSfL -o fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - if: steps.m.outputs.treba == '1'
        run: pip install -r requirements.txt
      - name: Whisper model iz cachea
        if: steps.m.outputs.treba == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Test – napravi videe (bez objave)
        if: steps.m.outputs.mode == 'test'
        env:
          BROJ: ${{ inputs.broj }}
          IDS: ${{ inputs.klipovi }}
        run: python -m clipper.main run --test "${BROJ:-3}" --ids "$IDS"
      - name: Spremi test videe
        if: steps.m.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: test-videi
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Objavi zadane klipove danas
        if: steps.m.outputs.mode == 'ids'
        env:
          IDS: ${{ inputs.klipovi }}
        run: python -m clipper.main run --ids "$IDS"
      - name: Napravi klipove i zakaži sve u Bufferu
        if: steps.m.outputs.mode == 'dan' && steps.m.outputs.treba == '1'
        run: python -m clipper.main dan --datum "${{ steps.m.outputs.datum }}"
      - name: Spremi posted.json
        if: always() && steps.m.outputs.mode != 'test' && steps.m.outputs.treba == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Zakazani klipovi za ${{ steps.m.outputs.datum || 'danas' }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Obavijest o grešci
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m clipper.main fail --run-url "$RUN_URL" --what "Objava klipova (${{ steps.m.outputs.mode }} ${{ steps.m.outputs.datum }})"

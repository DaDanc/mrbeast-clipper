name: 9. MrBeast + Financial Audit (skida tvoje računalo)

# YouTube blokira GitHub servere, pa videe skida TVOJE računalo (GitHub "self-hosted runner").
# Svaki dan u 17:10: ako je neobjavljenih MrBeast klipova malo, računalo skine 1-2 najgledanija
# MrBeast videa koja još nismo koristili, a GitHub od njih napravi klipove (AI odabir + hook).
# Ako je računalo ugašeno, posao čeka (do 24 h) i krene čim ga upališ.

on:
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      broj_videa:
        description: "Koliko videa skinuti (0 = samo ako treba)"
        default: "0"

permissions:
  contents: read
  issues: write

concurrency:
  group: mrbeast
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      broj: ${{ steps.p.outputs.broj }}
      koristeni: ${{ steps.p.outputs.koristeni }}
      kanal: ${{ steps.p.outputs.kanal }}
      min_trajanje: ${{ steps.p.outputs.min_trajanje }}
      kampanja: ${{ steps.p.outputs.kampanja }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml requests
      - id: p
        env:
          BROJ: ${{ inputs.broj_videa || '0' }}
        run: python -m clipper.main ytplan --broj "$BROJ"

  skini:
    needs: plan
    if: needs.plan.outputs.broj != '0'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    steps:
      - name: Alati (yt-dlp, ffmpeg, deno)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"
          $alati = Join-Path $env:RUNNER_TOOL_CACHE "mrbeast-alati"
          New-Item -ItemType Directory -Force $alati | Out-Null
          if (!(Test-Path "$alati\yt-dlp.exe")) {
            Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$alati\yt-dlp.exe"
          } else { & "$alati\yt-dlp.exe" -U }
          if (!(Test-Path "$alati\ffmpeg.exe")) {
            Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$alati\ff.zip"
            Expand-Archive "$alati\ff.zip" "$alati\ff" -Force
            Get-ChildItem "$alati\ff" -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination $alati
            Remove-Item "$alati\ff.zip","$alati\ff" -Recurse -Force
          }
          if (!(Test-Path "$alati\deno.exe")) {
            Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "$alati\deno.zip"
            Expand-Archive "$alati\deno.zip" $alati -Force
            Remove-Item "$alati\deno.zip"
          }
          Add-Content $env:GITHUB_PATH $alati

      - name: Odaberi i skini najgledanije neiskorištene videe
        shell: powershell
        env:
          BROJ: ${{ needs.plan.outputs.broj }}
          KORISTENI: ${{ needs.plan.outputs.koristeni }}
          KANAL: ${{ needs.plan.outputs.kanal }}
          MIN_TRAJANJE: ${{ needs.plan.outputs.min_trajanje }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $used = @($env:KORISTENI -split "," | Where-Object { $_ })
          $out = Join-Path $env:GITHUB_WORKSPACE "mrbeast"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          $lines = & yt-dlp --flat-playlist --playlist-items 1:400 --print "%(view_count)s|%(id)s|%(duration)s|%(title)s" $env:KANAL
          $list = foreach ($l in $lines) {
            $p = $l -split "\|", 4
            if ($p.Count -lt 4) { continue }
            $views = 0; $dur = 0
            [void][long]::TryParse($p[0], [ref]$views); [void][double]::TryParse($p[2], [ref]$dur)
            [pscustomobject]@{ Views = $views; Id = $p[1]; Dur = $dur; Title = $p[3] }
          }
          $pick = $list | Where-Object { $_.Dur -ge [int]$env:MIN_TRAJANJE -and $used -notcontains $_.Id } |
                  Sort-Object Views -Descending | Select-Object -First ([int]$env:BROJ)
          if (!$pick) { Write-Output "::error::Nisam našao nijedan novi MrBeast video."; exit 1 }
          foreach ($v in $pick) {
            Write-Output "::notice::Skidam: $($v.Title) ($([math]::Round($v.Views / 1e6)) mil. pregleda)"
            & yt-dlp -f "bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/bv*[height<=1080]+ba/b[height<=1080]" `
              --merge-output-format mp4 --restrict-filenames --no-playlist `
              -o "$out\%(id)s_%(title).50B.%(ext)s" "https://www.youtube.com/watch?v=$($v.Id)"
            if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Nije uspjelo: $($v.Title)" }
          }
          if (!(Get-ChildItem $out -Filter *.mp4)) { Write-Output "::error::Ništa nije skinuto."; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: mrbeast-videi
          path: mrbeast/*.mp4
          retention-days: 2
          compression-level: 0

      - name: Počisti računalo
        if: always()
        shell: powershell
        run: Remove-Item (Join-Path $env:GITHUB_WORKSPACE "mrbeast") -Recurse -Force -ErrorAction SilentlyContinue

  klipovi:
    needs: [plan, skini]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instaliraj ffmpeg i font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sSfL -o fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-
      - uses: actions/download-artifact@v4
        with:
          name: mrbeast-videi
          path: mrbeast
      - name: Napravi klipove
        env:
          KAMPANJA: ${{ needs.plan.outputs.kampanja }}
        run: |
          for f in mrbeast/*.mp4; do
            python -m clipper.main make --url "$f" --kampanja "$KAMPANJA"
          done

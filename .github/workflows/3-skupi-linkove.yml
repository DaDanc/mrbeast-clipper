name: 3. Skupi linkove za Vyro

on:
  schedule:
    - cron: "*/15 * * * *" # svakih 15 min (objave su u nasumična vremena)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests yt-dlp
      - name: Skupi linkove
        run: python -m clipper.main links
      - name: Provjeri preglede (obavijest na 1k / 5k)
        run: python -m clipper.main views

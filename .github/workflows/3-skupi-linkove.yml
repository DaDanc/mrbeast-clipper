name: 3. Skupi linkove za Vyro

on:
  schedule:
    - cron: "17 * * * *"   # svaki sat
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Skupi linkove
        run: python -m clipper.main links

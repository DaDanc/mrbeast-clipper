name: 3. Skupi linkove za Vyro

on:
  schedule:
    - cron: "17 * * * *"   # svaki sat
    - cron: "10 17 * * *"  # 18:10 po našem vremenu, odmah nakon objave u 18:00
    - cron: "40 19 * * *"  # 20:40
    - cron: "10 22 * * *"  # 23:10
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests yt-dlp
      - name: Skupi linkove
        run: python -m clipper.main links
      - name: Provjeri preglede (obavijest na 1k / 5k)
        run: python -m clipper.main views

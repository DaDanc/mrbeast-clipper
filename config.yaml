  - 101  # Taylor: titlovi pišu "Deborah Messing" (ključno ime u poanti)
  - 102  # Taylor: zbrkano o Vegasu, krivo prepoznata imena
  - 103  # Taylor: nabrajanje vježbi, nema priče
  - 104  # Taylor: počinje usred misli, završava usred rečenice
  - 105  # Taylor: Hoda i reklama za tapping vježbu, nema gosta

# Klipovi čiji se trenutak smije izrezati ponovo (npr. loš render).
napravi_ponovo: [18, 19, 21, 22, 24, 25, 26, 27, 28, 29, 58, 110, 111]

# Dnevne objave uzimaju SAMO provjerene klipove: one s opisom ispod
# ili one koje je odabrao i ocijenio AI (🤖 u naslovu Issuea).
samo_provjereni: true


# ==============================================================
#  POSTAVKE KLIPERA - ovo smiješ mijenjati
# ==============================================================

# ==============================================================
#  KAMPANJE
# ==============================================================
# Svaka kampanja može pregaziti bilo koju postavku ispod (hashtags, caption_template,
# brief, min_seconds, max_seconds, platforms, hype_words...). Što ne navede, uzima odozdo.
#   frameio_mapa      = javna Frame.io mapa; 2x dnevno se provjeri ima li novih epizoda
#   preskoci_datoteke = datoteke iz mape koje se ne koriste (gotovi klipovi koje svi objavljuju)
#   kraj              = zadnji dan kampanje (nakon toga se njezini klipovi ne objavljuju)
#   jedna_platforma   = isti video ne smije na više računa → svaki klip ide na jednu mrežu
zadana_kampanja: behemoth
kampanja_bez_oznake: joy101   # stari klipovi (prije profila kampanja) su iz Joy 101
min_minuta_epizode: 10
auto_klipova: 10

# Objavljuju se SAMO klipovi ovih kampanja (prazno = sve aktivne).
# 08.11.: profil se gradi na MrBeast klipovima (bez zarade); Joy 101 / Phony se više ne objavljuju,
# osim onih koji su već zakazani u Bufferu.
# 11.11.: Joy 101 / Phony gotovi. Emanuel ne želi skidati videe sam → samo Vyro kampanje s Frame.io materijalom.
objavljuj_kampanje: [behemoth]

kampanje:
  behemoth:
    naziv: "Behemoth! (Disney/Searchlight) – Phase 2"
    kraj: "2026-11-17"
    # Brief: klipati Pedro featurette (i Pedro spotove). 9x16 verzija i CUTDOWNS su gotovi rezovi – preskoči.
    # Pedro featurette, TV spot, digital spot, trailer 2. Gotovi vertikalni rezovi, cutdowni, bumper,
    # slike i audio-split se preskaču.
    frameio_mapa:
      - "https://next.frame.io/share/99f04c14-0969-43b3-84a4-12dcd927814b/4d2c40ff-78b6-472a-8a8e-85996a69c662"
      - "https://next.frame.io/share/99f04c14-0969-43b3-84a4-12dcd927814b/2d94dcab-11cc-4dd2-927e-ae30b29dfb54"
      - "https://next.frame.io/share/99f04c14-0969-43b3-84a4-12dcd927814b/0074723e-95fe-4500-b2b2-248e11d1b49a"
      - "https://next.frame.io/share/99f04c14-0969-43b3-84a4-12dcd927814b/f7bb526e-2204-458a-9d22-32933b69f9c3"
    preskoci_datoteke: "(?i)9x16|1080x1920|4x5|cutdowns|bumper|audio-split|\\.jpe?g$|\\.png$"
    min_minuta_epizode: 0
    auto_klipova: 6
    min_seconds: 15            # brief: min 15 s, max 2 min; kraći klipovi bolje prolaze
    max_seconds: 32
    # Disney: AI alati ne smiju trenirati na unosu → nikad besplatni Gemini, samo Claude API (ili bez AI-a).
    ai_samo: anthropic
    # Obavezno u opisu: naslov filma + datum; hashtagovi SAMO ovi (brief zabranjuje ostale).
    hashtags: "#Behemoth #paidpartner"
    caption_template: |
      {hook}

      Behemoth! In theaters December 4th. {hashtags}
    # Nije spojen Instagram na Vyro → samo TikTok (i nema iste objave na dva računa).
    platforms: [tiktok]
    brief: |
      Campaign: BEHEMOTH! (Searchlight/Disney), a film by Tony Gilroy starring Pedro Pascal,
      Olivia Wilde, Eva Victor and Will Arnett. In theaters December 4th.
      - Source is the official Pedro Pascal featurette. Spotlight Pedro Pascal's performance as a
        cellist searching for his place in the world (he learned to play the cello for the role).
      - Each clip must make sense on its own and end on a complete thought, not mid-sentence.
      - Positive only. Nothing negative about Disney, Searchlight or the film. Do not invent plot
        points, characters or storylines. Hooks must be true to the clip.
      - Good hook angles (from the brief): "Pedro Pascal learned to play the cello for this role",
        "Pedro Pascal finds his perfect movie star role", "The best performance of Pedro Pascal's career".
    hype_words: [pedro, pascal, cello, music, musician, performance, role, behemoth, tony, gilroy,
                 play, learned, character, beautiful, best]

  mrbeast:
    naziv: "MrBeast (bez kampanje – rast profila)"
    # Videe skida TVOJE računalo (YouTube blokira GitHub servere), workflow "9. MrBeast".
    youtube_kanal: "https://www.youtube.com/@MrBeast/videos"
    min_minuta_videa: 8        # preskoči kratke videe
    zaliha_klipova: 15         # kad neobjavljenih padne ispod ovoga, skine se novi video
    max_videa_dnevno: 2
    auto_klipova: 8
    min_seconds: 25
    max_seconds: 58
    hashtags: "#mrbeast #mrbeastclips #challenge #fyp"
    caption_template: |
      {hook}

      🎥 MrBeast {hashtags}
    platforms: [tiktok, instagram]
    brief: |
      Source: a MrBeast YouTube video (big-budget challenges, giveaways, extreme stunts).
      - Pick the most gripping moments: huge stakes, money reveals, eliminations, twists,
        shocked reactions, funny banter between Jimmy and the crew (Karl, Chandler, Nolan, Tareq).
      - The clip must make sense on its own: the viewer must understand the challenge/stakes
        within the first 3 seconds, and it must end on a payoff (reveal, win, reaction), not mid-sentence.
      - SKIP sponsor reads and ads (Feastables, Lunchly, apps, games), the intro and the outro.
      - Do not misrepresent what happened. Hooks must be true to the clip.
    hype_words: [million, dollars, "$", win, won, eliminated, last, survive, insane, crazy,
                 "oh my god", "no way", prize, money, keep, challenge, lose, island, car, house]

  financial_audit:
    naziv: "Financial Audit (Caleb Hammer) – rast profila"
    youtube_kanal: "https://www.youtube.com/@calebhammer/videos"
    min_minuta_videa: 25       # samo cijele epizode, ne kratki videi
    zaliha_klipova: 15
    max_videa_dnevno: 1        # epizode traju 1-2 h, jedna daje dosta klipova
    auto_klipova: 10
    min_seconds: 25
    max_seconds: 58
    hashtags: "#financialaudit #calebhammer #money #debt #fyp"
    caption_template: |
      {hook}

      🎥 Financial Audit {hashtags}
    platforms: [tiktok, instagram]
    brief: |
      Source: a Financial Audit episode (Caleb Hammer reviews a guest's income, debt and spending,
      often bluntly and with a lot of humor).
      - Pick the most gripping moments: shocking spending reveals (DoorDash, car loans, credit card
        debt, "how much?!"), Caleb's brutal one-liners and reactions, the guest's excuses, and
        moments where the math finally hits the guest.
      - The viewer must understand the situation (income / debt / what they bought) within the
        first 3 seconds, and the clip must end on a payoff (reaction, punchline, realization),
        not mid-sentence.
      - SKIP sponsor reads and ads (Chime, Kikoff, PDS Debt, DollarWise app, memberships), the
        intro and the outro.
      - SKIP moments about abuse, self-harm, serious illness, death or anything that would
        humiliate the guest beyond their spending choices. No personal data on screen beyond
        what is already in the episode.
      - Do not misrepresent what happened or what numbers were said. Hooks must be true to the clip.
    hype_words: [debt, "credit card", doordash, uber, loan, car, "how much", thousand, dollars, "$",
                 broke, budget, salary, income, rent, spent, spending, interest, "oh my god", "no way",
                 insane, crazy, why, stupid, bankrupt, savings, "make a month"]

  joy101:
    naziv: "Joy 101"
    kraj: "2026-11-10"
    frameio_mapa: "https://f.io/RWHt_IEp"
    preskoci_datoteke: "(?i)^shorts"
    # ostalo (hashtags, opis, brief, 32-58 s) = postavke ispod

  phony:
    naziv: "Phony (Hulu)"
    kraj: "2026-11-10"
    frameio_mapa: "https://f.io/f7W69-yn"
    preskoci_datoteke: "(?i)premade"
    hashtags: "#Phony #HuluPartner"
    caption_template: |
      {hook}

      Stream Phony on Hulu and Hulu on Disney+ for bundle subscribers. {hashtags}
    min_seconds: 20
    max_seconds: 55
    # Master ima 8 mono tragova: 0-5 = 5.1 (2 = centar, tu je dijalog), 6-7 = stereo miks.
    # Govor se prepoznaje samo s centra (nema pjesama), a klip dobiva stereo miks.
    audio_govor: 2
    audio_mix: [6, 7]
    # isti video ne smije na više računa → Phony ide samo na TikTok (od tamo se predaje na Vyro)
    platforms: [tiktok]
    brief: |
      Campaign: PHONY, a Hulu coming-of-age mystery series starring Connie Britton and Sam Nivola.
      A teenager wakes up in the hospital after a car accident and discovers his mom appears to
      have been replaced by an impostor.
      - Pick attention-grabbing moments: the central mystery, conspiracy theories, the close-knit
        friend group, Connie Britton's star power.
      - The clip must make sense on its own and must not misrepresent the scene or invent a plot.
      - AVOID scenes where music is playing (licensed songs are forbidden) – prefer pure dialogue.
      - Nothing negative about Disney, Hulu or the show. At least 15 seconds.
    hype_words: [mom, impostor, imposter, fake, real, "who are you", accident, hospital, lying,
                 liar, secret, conspiracy, "what happened", "not my mom", police, truth, weird, crazy]

# Koliko klipova napraviti iz jednog videa
clips_per_video: 8

# Dužina klipa u sekundama.
# Joy 101 traži NAJMANJE 30 sekundi (32 radi sigurnosti).
min_seconds: 32
max_seconds: 58

# Whisper model za prepoznavanje govora.
# "small" = dobar omjer brzine i točnosti. "base" je brži, "medium" točniji ali spor.
whisper_model: small

# Hashtagovi. SVAKA KAMPANJA IMA SVOJE i obično zabranjuje sve ostale!
# Uzmi ih iz briefa kampanje na Vyro. Kad pokrećeš "1. Napravi klipove",
# možeš ih upisati u polje "hashtagovi" i tada vrijedi to, a ne ovo ovdje.
hashtags: "#iHeartPodcasts"

# Tekst objave. {hook} = rečenica iz klipa, {hashtags} = hashtagovi kampanje.
# Joy 101: obavezni tekst kampanje mora biti u svakom opisu.
caption_template: |
  {hook}

  Joy 101 with Hoda Kotb, an iHeart podcast. New episodes every Wednesday on YouTube. {hashtags}

# Izgled klipa:
#   full = lice preko cijelog ekrana (9:16 izrez oko lica), hook gore cijelo vrijeme, veliki titlovi
#   blur = stari izgled: video u sredini, mutna pozadina gore i dolje
izgled: full
# Verzija izgleda (2 = izrez prati lice u svakom kadru posebno). Povećaj pa pokreni "8. Ponovni render".
izgled_verzija: 2

# Naslov (hook) velikim slovima na vrhu videa u prve 4 s.
#   auto  = samo kad je klip odabrao AI (on piše pravi hook, a ne komad rečenice)
#   true / false = uvijek / nikad
naslov_na_videu: auto

# ==============================================================
#  AI ODABIR KLIPOVA
# ==============================================================
# AI pročita cijeli transkript, izabere najbolje momente, odbaci loše
# (izvan konteksta, prekinute, osjetljive) i napiše hook i opis.
# Treba secret GEMINI_API_KEY (besplatan, aistudio.google.com/apikey)
# ili ANTHROPIC_API_KEY. Bez ključa radi stari način.
ai_izbor: true

# Klipovi s AI ocjenom ispod ovoga se ne prave (1-10).
ai_min_ocjena: 7

# Gemini modeli redom – ako prvi ne radi, probava sljedeći.
ai_gemini_modeli:
  - gemini-3.8-flash
  - gemini-3.6-flash
  - gemini-3.5-flash-lite

# Ako koristiš Claude ključ umjesto Geminija:
ai_claude_model: claude-haiku-5-5

# Pravila kampanje koja AI mora poštovati. PROMIJENI kad mijenjaš kampanju!
brief: |
  Campaign: Joy 101 with Hoda Kotb (iHeartPodcasts), a podcast where Hoda talks with
  celebrity guests about joy, family, career and life lessons.
  - Clips must be at least 30 seconds long.
  - Feature the guest telling a story or Hoda and the guest reacting; avoid parts where
    only Hoda talks about the app, sponsors, or promotes the show.
  - Keep it positive and respectful of the guest; nothing that misrepresents what they said.

# Naslov za YouTube Shorts (max 100 znakova).
youtube_title_template: "{hook}"

# Na koje mreže objavljivati (moraju biti povezane u Bufferu).
# Mogućnosti: tiktok, instagram, youtube
platforms:
  - tiktok
  - instagram
  # - youtube   # Joy 101: iHeartMedia Content ID blokira klipove na YouTubeu (28.10.)

# Kad objaviti:
#   schedule   = u sljedeći slobodan termin iz post_times ispod (preporučeno)
#   addToQueue = u sljedeći slobodan termin iz Buffer rasporeda
#   shareNow   = odmah
post_mode: schedule

# Termini objava (po tvom vremenu). Publika je uglavnom iz SAD-a:
# 18:00 = 12h u New Yorku, 20:30 = 14:30h, 23:00 = 17h.
timezone: Europe/Zagreb
# Objava svakih 60–100 min (svaki put drugo vrijeme), samo u prozoru 14:00–04:00
# (= 8:00–22:00 u New Yorku). Ako ovo obrišeš, vrijede fiksni post_times ispod.
# razmak_minuta: [60, 100]   # isključeno 30.10. – vraćeni fiksni termini (3 dnevno) jer je TikTok pao
# pauza_do: ""
# prozor_objava: ["14:00", "04:00"]
# 11.11.: 2 dnevno (3 nisu prolazila), svaki dan ±8 min drugačije – kao da objavljuje čovjek.
post_times:
  - "20:00"
  - "22:00"
pomak_minuta: 8

# Dnevno punjenje (workflow "5. Dnevne objave", svaki dan u 17:00):
# drži u Bufferu ovoliko objava na čekanju (po 3 dnevno u post_times terminima),
# uzimajući najbolje neobjavljene klipove. 9 = 3 dana unaprijed.
# Buffer besplatno dopušta najviše 10 zakazanih objava po kanalu.
daily_posts: 6
# Obavijest (17 h) kad klipova ostane za ovoliko dana ili manje.
upozori_dana: 2

# Obavijest na mobitel za SVAKU objavu (false = samo zapis u "Linkovi za Vyro", bez obavijesti).
# Ugašeno: s jednom Vyro predajom bitne su samo obavijesti o pregledima ispod.
obavijest_za_svaku_objavu: false

# Obavijest (GitHub, s @mention) kad TikTok objava prijeđe ove brojeve pregleda.
# Provjerava se svaki sat, za objave iz zadnjih "prati_dana" dana.
obavijest_pregledi: [500, 1000, 5000]
prati_dana: 7


# Automatsko objavljivanje: koliko najbolje ocijenjenih klipova po videu
# objaviti BEZ tvog odobrenja. 0 = ništa automatski, sve ručno labelom "objavi".
auto_publish: 0   # klipove prvo provjerava Claude prema briefu, zatim idu u Buffer

# Klipovi (brojevi Issuea) koji NISU prošli provjeru prema briefu – nikad se ne objavljuju.
preskoci:
